message: "I replied on Linkedin but wanted to connect the thread here: _Interesting comment Andrew._ \r\n\r\n_One of the things that we see, aside from larger organizations pushing risk onto smaller ones is businesses with a large share valuation resting on their laurels. Trust can be broken, but it can also be rebuilt. When Apple removes the ADB and SCSI buses and forces the world to adopt a new protocol (USB) that happens as part of a massive innovation process. You could argue that there hasn't been any curve-jumping innovation coming out of Apple for a few years now and they've solidified their flavour of monopoly. They need to decide where they stand on this one, just playing the same approach over again and forcing the little guy into their funnel may stop working soon._ \r\n\r\n_If Huawei can rebuild trust with Western consumers and/or governments then actors like Apple will see their foundations loosened_"
