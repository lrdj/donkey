<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="Signed messages flow through interchangeable relays" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13">
  <style>
    .ink { fill: #1f1f1f; }
    .quiet { fill: #6b6b6b; }
    .edge { stroke: #b8b4a8; }
    .arrowhead { fill: #b8b4a8; }
    .accent { stroke: #2f6fd6; fill: #2f6fd6; fill-opacity: 0.12; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #ececec; }
      .quiet { fill: #a8a8a8; }
      .edge { stroke: #6e6b64; }
      .arrowhead { fill: #6e6b64; }
      .accent { stroke: #6aa0f5; fill: #6aa0f5; fill-opacity: 0.16; }
    }
  </style>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="arrowhead"/>
    </marker>
  </defs>

  <text x="24" y="34" font-size="15" font-weight="600" class="ink">Signed messages flow through interchangeable relays</text>

  <!-- connectors -->
  <g fill="none" stroke-width="1.25" class="edge">
    <path d="M208 144H272" marker-end="url(#arch-arrow)"/>
    <path d="M488 144H552" marker-end="url(#arch-arrow)"/>
    <path d="M380 244V284" marker-end="url(#arch-arrow)"/>
    <path d="M488 320H520V172H552" marker-end="url(#arch-arrow)"/>
    <path d="M644 268V204" marker-end="url(#arch-arrow)"/>
  </g>

  <!-- organiser -->
  <rect x="24" y="100" width="184" height="88" rx="8" fill="none" stroke-width="1.25" class="edge"/>
  <text x="36" y="124" font-weight="600" class="ink">Organiser app</text>
  <text x="36" y="140" font-size="11.5" class="ink">Holds organiser keys</text>
  <text x="36" y="156" font-size="11.5" class="ink">Signs broadcasts</text>
  <text x="36" y="172" font-size="11.5" class="ink">and actions</text>

  <!-- relays -->
  <rect x="272" y="60" width="216" height="184" rx="8" fill="none" stroke-width="1.25" class="edge"/>
  <text x="288" y="84" font-weight="600" class="ink">Relays, 3–5 in use</text>
  <rect x="288" y="92" width="184" height="40" rx="8" fill="none" stroke-width="1.25" class="edge"/>
  <text x="380" y="116" text-anchor="middle" class="ink">Public relay A</text>
  <rect x="288" y="140" width="184" height="40" rx="8" fill="none" stroke-width="1.25" class="edge"/>
  <text x="380" y="164" text-anchor="middle" class="ink">Public relay B</text>
  <rect x="288" y="188" width="184" height="40" rx="8" fill="none" stroke-width="1.25" class="edge"/>
  <text x="380" y="212" text-anchor="middle" class="ink">Group’s own relay</text>

  <!-- member -->
  <rect x="552" y="100" width="184" height="104" rx="8" stroke-width="2" class="accent"/>
  <text x="564" y="124" font-weight="600" class="ink">Member web app</text>
  <text x="564" y="140" font-size="11.5" class="ink">Keypair made on device</text>
  <text x="564" y="156" font-size="11.5" class="ink">Checks signed alerts</text>
  <text x="564" y="172" font-size="11.5" class="ink">RSVP, pledge, map pins</text>
  <text x="564" y="188" font-size="11.5" class="ink">Caches plans offline</text>

  <!-- push -->
  <rect x="272" y="284" width="216" height="72" rx="8" fill="none" stroke-width="1.25" class="edge"/>
  <text x="284" y="308" font-weight="600" class="ink">Push services</text>
  <text x="284" y="324" font-size="11.5" class="ink">Web Push; ntfy on Android</text>
  <text x="284" y="340" font-size="11.5" class="ink">SMS or email fallback</text>

  <!-- invite -->
  <rect x="552" y="268" width="184" height="72" rx="8" fill="none" stroke-width="1.25" class="edge"/>
  <text x="564" y="292" font-weight="600" class="ink">Invite QR card</text>
  <text x="564" y="308" font-size="11.5" class="ink">Group ID, organiser keys</text>
  <text x="564" y="324" font-size="11.5" class="ink">and relay list</text>

  <!-- edge labels -->
  <text x="240" y="136" text-anchor="middle" font-size="11.5" class="quiet">publish</text>
  <text x="520" y="136" text-anchor="middle" font-size="11.5" class="quiet">subscribe</text>
  <text x="388" y="268" font-size="11.5" class="quiet">new event</text>
  <text x="514" y="268" text-anchor="end" font-size="11.5" class="quiet">wake-up</text>
  <text x="652" y="240" font-size="11.5" class="quiet">first launch</text>
</svg>
